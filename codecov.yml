codecov:
  max_report_age: off
  require_ci_to_pass: true

bundle_analysis:
  status: warning
  warning_threshold: 1%

comment:
  require_bundle_changes: bundle_increase
  bundle_change_threshold: 50Kb
  require_changes: 'coverage_drop OR uncovered_patch'
  # PR runs measure only the changed files, so a PR has no full project figure.
  hide_project_coverage: true

coverage:
  status:
    # Coverage of the changed lines. Informational during the trial: it reports
    # but does not fail. Limited to the flags that PR runs upload, so that stale
    # carried-forward data (nightly, Postgres, Python) cannot change the result.
    patch:
      default:
        target: 80%
        informational: true
        only_pulls: true
        flags:
          - backend-unit
          - backend-integration
          - nodes-unit
          - frontend
    project:
      default:
        threshold: 0.5
        flags:
          - nightly-full

github_checks:
  annotations: false

flags:
  backend-unit:
    carryforward: true
  backend-integration:
    carryforward: true
  backend-integration-postgres:
    carryforward: true
  nodes-unit:
    carryforward: true
  frontend:
    carryforward: true
  frontend-e2e:
    carryforward: true
  python:
    carryforward: true
  nightly-full:
    carryforward: true
  nightly-python:
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - '!master'
  individual_components:
    - component_id: backend_packages
      name: Backend
      paths:
        - packages/cli/**
        - packages/core/**
        - packages/workflow/**
        - packages/extensions/**
        - packages/@MNI/api-types/**
        - packages/@MNI/backend-common/**
        - packages/@MNI/backend-services/**
        - packages/@MNI/backend-test-utils/**
        - packages/@MNI/cli/**
        - packages/@MNI/client-oauth2/**
        - packages/@MNI/config/**
        - packages/@MNI/constants/**
        - packages/@MNI/crdt/**
        - packages/@MNI/db/**
        - packages/@MNI/decorators/**
        - packages/@MNI/di/**
        - packages/@MNI/engine/**
        - packages/@MNI/errors/**
        - packages/@MNI/expression-runtime/**
        - packages/@MNI/extension-sdk/**
        - packages/@MNI/imap/**
        - packages/@MNI/local-gateway/**
        - packages/@MNI/permissions/**
        - packages/@MNI/scan-community-package/**
        - packages/@MNI/syslog-client/**
        - packages/@MNI/task-runner/**
        - packages/@MNI/task-runner-python/**
        - packages/@MNI/tournament/**
        - packages/@MNI/workflow-sdk/**
    - component_id: frontend_packages
      name: Frontend
      paths:
        - packages/frontend/**
        - packages/@MNI/codemirror-lang/**
        - packages/@MNI/codemirror-lang-html/**
        - packages/@MNI/codemirror-lang-sql/**
    - component_id: nodes_packages
      name: Nodes
      paths:
        - packages/node-dev/**
        - packages/nodes-base/**
        - packages/@MNI/json-schema-to-zod/**
      statuses:
        - type: project
          target: auto
          threshold: 0% # Enforce: Coverage must not decrease
    - component_id: ai_packages
      name: AI
      paths:
        - packages/@MNI/agents/**
        - packages/@MNI/ai-node-sdk/**
        - packages/@MNI/ai-utilities/**
        - packages/@MNI/ai-workflow-builder.ee/**
        - packages/@MNI/chat-hub/**
        - packages/@MNI/computer-use/**
        - packages/@MNI/instance-ai/**
        - packages/@MNI/mcp-browser/**
        - packages/@MNI/mcp-browser-extension/**
        - packages/@MNI/nodes-langchain/**
    - component_id: utils_packages
      name: Utils
      paths:
        - packages/@MNI/create-node/**
        - packages/@MNI/node-cli/**
        - packages/@MNI/utils/**

ignore:
  # Test source
  - (?s:.*/[^\/]*\.spec\.ts.*)\Z
  - (?s:.*/[^\/]*\.test\.ts.*)\Z
  - (?s:.*/[^\/]*e2e[^\/]*\.ts.*)\Z
  - (?s:.*/test_[^\/]*\.py.*)\Z
  - (?s:.*/__tests__/.*)\Z
  - (?s:.*/__mocks__/.*)\Z
  # Non-product source
  - (?s:.*/[^\/]*\.stories\.(ts|vue).*)\Z
  - (?s:.*\.d\.ts.*)\Z
  - (?s:.*/[^\/]*\.config\.(ts|js|mjs).*)\Z
  - (?s:.*/migrations/(postgresdb|sqlite|mysqldb)/.*\.ts.*)\Z
  - (?s:.*/scripts/.*)\Z
  # Test/build infrastructure packages
  - (?s:.*/packages/testing/.*)\Z
  - (?s:.*/packages/@MNI/(benchmark|eslint-config|eslint-plugin-community-nodes|stylelint-config|typescript-config|vitest-config)/.*)\Z
