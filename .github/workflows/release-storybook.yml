name: 'Release: Storybook'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'packages/frontend/@MNI/storybook/**'
      - 'packages/frontend/@MNI/chat/**'
      - 'packages/frontend/@MNI/design-system/**'
      - '.github/workflows/release-storybook.yml'
concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare Pages
    if: |
      !contains(github.event.pull_request.labels.*.name, 'community') &&
      github.repository == 'MNI-io/MNI'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm run build --filter=@MNI/utils --filter=@MNI/vitest-config --filter=@MNI/design-system

      - name: Build
        working-directory: packages/frontend/@MNI/storybook
        run: |
          pnpm build

      - name: Setup Wrangler Pre-requisites
        run: |
          echo "ignore-workspace-root-check=true" >> .npmrc
          pnpm add --global wrangler

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        id: cloudflare_deployment
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/frontend/@MNI/storybook/storybook-static --project-name=storybook --branch=${{github.ref_name}} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
