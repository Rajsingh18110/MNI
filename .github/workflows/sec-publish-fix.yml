name: 'Security: Publish fix'

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  sync-security-fix:
    if: github.repository == 'MNI-io/MNI-private' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.MNI_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.MNI_ASSISTANT_PRIVATE_KEY }}
          owner: MNI-io
          repositories: MNI,MNI-private

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Open PR to public repo
        run: |
          COMMIT_TO_PUBLISH=$(git rev-parse HEAD)
          BRANCH_NAME="private-$(date +%Y%m%d-%H%M%S)"

          git remote add public-repo https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/MNI-io/n8n.git
          git fetch public-repo master
          git checkout -b "$BRANCH_NAME" public-repo/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick "$COMMIT_TO_PUBLISH"
          git push public-repo "$BRANCH_NAME"
          gh pr create \
            --repo MNI-io/MNI \
            --base master \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "Cherry-picked from MNI-private. Original PR: $PR_URL"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Notify on failure
        if: failure()
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel '#alerts-security' \
            --text 'Security fix PR creation failed. Run "Security: Sync from Public" workflow, rebase your branch, reopen PR. (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
