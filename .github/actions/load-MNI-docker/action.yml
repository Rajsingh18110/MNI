# Restores the MNI + runners image tarball (produced by build-MNI-docker
# under the variant+SHA-derived cache key) and loads both images into the
# local docker daemon.
#
# After this action runs, `n8nio/MNI:local` and `n8nio/runners:local` are
# present on the runner.
#
# If the cache entry has been evicted (e.g. Blacksmith cache thrash between
# prepare-docker and slow shards), the action falls back to invoking
# build-MNI-docker, which leaves both images tagged in dockerd and re-saves
# the tarball to cache as a side effect.

name: 'Load MNI Docker images from cache'
description: 'Restores the MNI + runners image tarballs from the variant+SHA-keyed GHA cache and loads both images into the local docker daemon. Falls back to rebuilding on cache miss.'

inputs:
  build-variant:
    description: 'Variant of the image to load. Must match what build-MNI-docker used (standard, coverage, or pc).'
    required: false
    default: 'standard'
  cache-sha:
    description: 'SHA for the image cache key. Empty = github.sha. Override when testing a ref other than the triggering commit (e.g. a PR head resolved at dispatch time) so the restore matches the code under test instead of a stale image (cache miss => rebuild from the checkout).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Restore image tarball from cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: MNI-docker-image-v2-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}
        path: /tmp/MNI-images

    - name: Load MNI and runners images into docker
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      # A restore reports a hit whatever it wrote, and writes to the paths
      # recorded at save time. Fail loudly rather than letting an unexpanded
      # glob reach `docker load`.
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(/tmp/MNI-images/*.tar)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::cache hit but /tmp/MNI-images holds no archives"
          exit 1
        fi
        for f in "${files[@]}"; do docker load -i "$f"; done

    - name: Warn on cache miss
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUILD_VARIANT: ${{ inputs.build-variant }}
        GITHUB_SHA: ${{ inputs.cache-sha || github.sha }}
      run: |
        echo "::warning::Cache miss for MNI-docker-image-v2-$BUILD_VARIANT-$GITHUB_SHA (SHA $GITHUB_SHA); falling back to rebuild via build-MNI-docker."

    - name: Rebuild image on cache miss
      if: steps.restore.outputs.cache-hit != 'true'
      uses: ./.github/actions/build-MNI-docker
      with:
        build-variant: ${{ inputs.build-variant }}

    # build-MNI-docker writes archives rather than loading them, so the fallback
    # has to load them here or downstream steps find no images.
    - name: Load rebuilt images into docker
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(/tmp/MNI-images/*.tar)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::rebuild produced no archives in /tmp/MNI-images"
          exit 1
        fi
        for f in "${files[@]}"; do docker load -i "$f"; done
